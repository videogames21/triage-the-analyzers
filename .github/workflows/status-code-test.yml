# Pull request check: StatusCodeTest must pass before a merge to main.
# It guards the PMD InstantiableUtilityClass finding on StatusCode (the class must keep a private constructor).
# Same action pins as maven-build.yml. To make this block a merge, add the "StatusCodeTest" check to the
# branch protection rule (or ruleset) for main under Settings > Branches: a workflow alone only reports.

name: StatusCodeTest

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  status-code-test:
    name: StatusCodeTest
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      # With -Dtest set, Surefire fails the build if no test matches, so deleting the test also fails this check.
      - name: Run StatusCodeTest
        working-directory: ./backend
        run: mvn --batch-mode test -Dtest=StatusCodeTest
